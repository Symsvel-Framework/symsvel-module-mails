name: QA
on: [push, pull_request]
concurrency:
  group: mails-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
      - name: Install public Composer dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          test -n "$SYMSVEL_READ_TOKEN"
          if ! curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $SYMSVEL_READ_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Symsvel-Framework/symsvel-module-acls"; then
            echo "::error::SYMSVEL_READ_TOKEN cannot read public repository symsvel-module-acls."
            exit 1
          fi
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
      - name: Lint PHP sources and tests
        run: find back/src back/tests -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - run: composer qa
